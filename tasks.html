<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks | Tecnara Grupo 02</title>
  <meta name="description" content="A simple task manager.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/tasks.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="grid"></span>
  </div>

  <header class="nav">
    <a class="logo" href="index.html"><span class="logo-dot"></span>tecnara<b>grupo02</b></a>
    <nav>
      <a href="index.html">Home</a>
      <a class="nav-cta" href="tasks.html" aria-current="page">Tasks</a>
      <a class="nav-cta" href="roadmap.html">Road to Rome</a>
    </nav>
  </header>

  <main class="tasks-main">
    <h1 class="tasks-title">Task <span class="gradient">manager</span></h1>
    <p class="lead">Your tasks are saved in this browser only.</p>

    <form id="task-form" class="task-form" autocomplete="off">
      <label for="task-input" class="sr-only">New task</label>
      <input id="task-input" type="text" maxlength="120" placeholder="Add a new task..." required>
      <button class="btn btn-primary" type="submit">Add</button>
    </form>

    <div class="toolbar">
      <span id="counter" aria-live="polite"></span>
      <div class="filters" role="group" aria-label="Filter tasks">
        <button type="button" data-filter="all" class="active">All</button>
        <button type="button" data-filter="active">Active</button>
        <button type="button" data-filter="done">Done</button>
      </div>
      <button type="button" id="clear-done" class="link-btn">Clear completed</button>
    </div>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty" class="empty" hidden>Nothing here. Add a task above.</p>
  </main>

  <footer class="footer">
    <span>© 2026 tecnaragrupo02</span>
    <a href="https://github.com/tecnaragrupo02" target="_blank" rel="noopener noreferrer">github.com/tecnaragrupo02</a>
  </footer>

  <script src="js/tasks.js"></script>
</body>
</html>
